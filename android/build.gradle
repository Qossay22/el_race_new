allprojects {
    repositories {
        google()
        mavenCentral()
    }
    tasks.withType(JavaCompile).configureEach {
        options.compilerArgs << "-Xlint:none"
    }
}
subprojects {
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            project.android {
                if (namespace == null) {
                    namespace project.group
                }
                
                // Ensure all plugins use at least compileSdk 36 (required by resolved AndroidX dependencies)
                // This fixes the "resource android:attr/lStar not found" error
                // Force compileSdk to 36 for all plugins to ensure compatibility with all dependencies
                compileSdkVersion 36
                
                // Ensure consistent JVM target across all plugins
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_17
                    targetCompatibility JavaVersion.VERSION_17
                }
            }
            
            // Set Kotlin JVM target for all subprojects
            project.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
                kotlinOptions {
                    jvmTarget = '17'
                }
            }

            // flutter_inappwebview_android can fail R8 minification with missing
            // internal classes in release; disable minify for that module.
            if (project.name == 'flutter_inappwebview_android') {
                project.android.buildTypes {
                    release {
                        minifyEnabled false
                        shrinkResources false
                    }
                }
            }
        }
    }
}
rootProject.buildDir = '../build'

subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
